name: Check site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Accessibility tests run in a real browser so axe can evaluate colour
      # contrast, target size and focus occlusion against actual layout.
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm check
      - run: pnpm test
